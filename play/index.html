<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta name="description" content="Vertical Valet: drive a rocket-thruster sports car up the walls of a night city and park it in a garage bay on the side of a skyscraper.">
<title>Vertical Valet</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
  :root { --cyan: #35f2ff; --pink: #ff3bd4; --amber: #ffb02e; --ink: #f2f4ff; --dim: #9aa3c4; --bg: rgba(8, 9, 22, 0.62); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05040c; overflow: hidden; color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none; }
  #app canvas { display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud button { pointer-events: auto; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---- in-play HUD */
  .hud-play { position: absolute; inset: 0; transition: opacity .4s; }
  #hud.title .hud-play { opacity: 0; }
  .tl { position: absolute; left: max(16px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); }
  .lvl { font-size: 12px; letter-spacing: .22em; color: var(--dim); font-weight: 600; }
  .timer { font: 700 30px/1.1 "Consolas", "SF Mono", ui-monospace, monospace; letter-spacing: .02em; text-shadow: 0 0 12px rgba(53,242,255,.35); }
  .radio { position: absolute; right: max(16px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top)); text-align: right;
    background: var(--bg); border: 1px solid rgba(255,255,255,.08); border-right: 3px solid var(--sc, var(--cyan)); border-radius: 10px; padding: 8px 12px 7px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .r-freq { font-size: 11px; letter-spacing: .18em; color: var(--sc, var(--cyan)); font-weight: 700; }
  .r-name { font-size: 15px; font-weight: 800; letter-spacing: .06em; }
  .r-hint { font-size: 10px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; margin-top: 1px; }
  .station-pop { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); text-align: center; opacity: 0; pointer-events: none; }
  .sp-freq { font: 700 14px monospace; letter-spacing: .3em; color: var(--sc); }
  .sp-name { font-size: clamp(28px, 6vw, 54px); font-weight: 900; font-style: italic; letter-spacing: .04em; color: #fff;
    text-shadow: 0 0 18px var(--sc), 0 0 40px var(--sc), 0 3px 0 rgba(0,0,0,.6); }
  .sp-tag { font-size: 14px; color: #dfe3ff; letter-spacing: .08em; margin-top: 2px; text-shadow: 0 1px 4px #000; }

  .bl { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); }
  .speed { display: flex; align-items: baseline; gap: 6px; }
  .sv { font: 800 54px/0.95 "Segoe UI", system-ui, sans-serif; font-style: italic; font-variant-numeric: tabular-nums; text-shadow: 0 0 16px rgba(255,59,212,.45); min-width: 2.2ch; }
  .su { font-size: 13px; color: var(--dim); letter-spacing: .12em; }
  .alt { font-size: 13px; color: var(--dim); letter-spacing: .16em; margin-top: 4px; }
  .alt b { color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }
  .fuel { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: min(240px, 38vw); }
  .f-label { font-size: 11px; letter-spacing: .2em; color: var(--dim); text-align: right; margin-bottom: 5px; font-weight: 700; }
  .f-bar { height: 12px; border-radius: 7px; background: rgba(255,255,255,.08); overflow: hidden; border: 1px solid rgba(255,255,255,.12); }
  .f-fill { height: 100%; transform-origin: left; background: linear-gradient(90deg, #ff7a2e, #ffd23e); box-shadow: 0 0 14px #ff9a2e; transition: transform .08s linear; }
  .fuel.burn .f-fill { background: linear-gradient(90deg, #ff5a1e, #fff2a8); }
  .fuel.low .f-fill { background: #ff2a3a; animation: blink .4s infinite alternate; }
  .fuel.low .f-label { color: #ff5a6a; }
  @keyframes blink { to { opacity: .45; } }
  .ladder { position: absolute; right: max(22px, env(safe-area-inset-right)); top: 26%; height: 40%; width: 4px; background: rgba(255,255,255,.12); border-radius: 2px; }
  .l-fill { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(0deg, rgba(255,59,212,.2), var(--pink)); border-radius: 2px; }
  .l-car { position: absolute; left: -5px; width: 14px; height: 14px; margin-bottom: -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px var(--pink); }
  .l-home { position: absolute; right: -4px; height: 2px; width: 12px; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .l-home span { position: absolute; right: 16px; top: -7px; font-size: 10px; letter-spacing: .16em; color: var(--cyan); font-weight: 800; }
  .marker { position: absolute; left: 0; top: 0; width: 0; height: 0; transition: opacity .3s; }
  .m-ring { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; border: 2px solid var(--cyan); border-radius: 50%;
    box-shadow: 0 0 12px var(--cyan), inset 0 0 8px var(--cyan); animation: ring 1.4s infinite; }
  @keyframes ring { 50% { transform: scale(1.15); } }
  .m-arrow { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; display: none; }
  .m-arrow::after { content: ""; position: absolute; left: 22px; top: 2px; border: 7px solid transparent; border-left: 12px solid var(--cyan); filter: drop-shadow(0 0 6px var(--cyan)); }
  .marker.edge .m-arrow { display: block; }
  .m-text { position: absolute; left: 0; top: 20px; transform: translateX(-50%); white-space: nowrap; font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--cyan); text-shadow: 0 1px 4px #000, 0 0 8px rgba(53,242,255,.5); }
  .toast { position: absolute; left: 50%; top: 30%; transform: translate(-50%, 0); max-width: min(560px, 86vw); text-align: center;
    font-size: clamp(15px, 2.2vw, 19px); font-weight: 600; line-height: 1.35; padding: 10px 18px; border-radius: 12px; background: var(--bg);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity .3s, transform .3s; }
  .toast.show { opacity: 1; }
  .toast.small { top: 40%; background: none; backdrop-filter: none; font-size: 22px; font-weight: 900; font-style: italic; letter-spacing: .1em; color: #fff; text-shadow: 0 0 14px var(--amber), 0 2px 0 #000; }

  /* ---- parked */
  .parked-ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: max(9vh, 70px) 0 max(5vh, 24px); opacity: 0; pointer-events: none; transition: opacity .3s; }
  #hud.parked .parked-ov { opacity: 1; }
  #hud.parked .hud-play .marker, #hud.parked .hud-play .toast { opacity: 0 !important; }
  .pk-title { display: flex; flex-direction: column; align-items: center; line-height: .9; }
  .pk-title span { font-size: clamp(54px, min(13vw, 13vh), 128px); font-weight: 900; font-style: italic; letter-spacing: .02em; opacity: 0; transform: scale(1.6); }
  .pk-title .w1 { color: #fff; text-shadow: 0 0 24px rgba(53,242,255,.9), 0 0 60px rgba(53,242,255,.6), 0 5px 0 rgba(0,0,0,.5); }
  .pk-title .w2 { color: #7dffc3; text-shadow: 0 0 24px rgba(40,255,160,.9), 0 0 70px rgba(40,255,160,.6), 0 5px 0 rgba(0,0,0,.5); }
  #hud.parked .pk-title .w1 { animation: slam .5s .15s cubic-bezier(.2,1.6,.4,1) forwards; }
  #hud.parked .pk-title .w2 { animation: slam .5s .55s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes slam { to { opacity: 1; transform: scale(1); } }
  .card { pointer-events: auto; width: min(380px, 88vw); background: rgba(8,9,22,.78); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 16px 18px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transform: translateY(16px); }
  #hud.parked .card { animation: up .5s 1.4s ease forwards; }
  @keyframes up { to { opacity: 1; transform: none; } }
  .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; color: var(--dim); border-bottom: 1px solid rgba(255,255,255,.06); }
  .row b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .row.total { font-size: 20px; border: 0; padding-top: 10px; }
  .row.total b { color: #7dffc3; font-size: 26px; }
  .c-best { text-align: right; font-size: 12px; letter-spacing: .2em; color: var(--amber); font-weight: 800; }
  .btns { display: flex; gap: 10px; margin-top: 12px; }
  .btns button, .p-box button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); font-weight: 700; letter-spacing: .06em; }
  button.primary { background: linear-gradient(90deg, #13c9ff, #8b5bff); border: 0; color: #fff; box-shadow: 0 0 22px rgba(53,180,255,.45); }

  /* ---- pause */
  .pause-ov { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(4,4,12,.55); }
  #hud.paused .pause-ov { display: flex; pointer-events: auto; }
  .p-box { display: flex; flex-direction: column; gap: 10px; width: min(300px, 80vw); text-align: center; }
  .p-box h2 { margin: 0 0 6px; letter-spacing: .3em; }

  /* ---- title */
  .title-ov { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: auto;
    background: radial-gradient(ellipse at 50% 60%, rgba(5,4,12,.15), rgba(5,4,12,.75)); }
  #hud.title .title-ov { display: flex; }
  .t-inner { text-align: center; padding: 20px; width: min(560px, 94vw); }
  .logo { display: flex; flex-direction: column; line-height: .86; transform: skewX(-8deg); }
  .logo .l1 { font-size: clamp(46px, 12vw, 92px); font-weight: 900; letter-spacing: .06em; color: #fff;
    text-shadow: 0 0 20px var(--pink), 0 0 50px rgba(255,59,212,.6), 0 4px 0 #3a0a40; }
  .logo .l2 { font-size: clamp(56px, 15vw, 116px); font-weight: 900; letter-spacing: .16em; color: transparent; -webkit-text-stroke: 2px var(--cyan);
    text-shadow: 0 0 22px rgba(53,242,255,.7); }
  .tagline { margin: 18px auto 22px; color: #d7dcff; font-size: clamp(14px, 2.4vw, 17px); line-height: 1.45; text-shadow: 0 1px 6px #000; }
  .b-play { font-size: 22px; font-weight: 900; letter-spacing: .3em; padding: 14px 54px; border-radius: 40px; }
  .levels { display: flex; gap: 10px; justify-content: center; margin: 22px 0 18px; flex-wrap: wrap; }
  .lv { display: flex; flex-direction: column; align-items: flex-start; min-width: 140px; flex: 1; max-width: 170px; padding: 10px 12px; border-radius: 12px;
    background: rgba(10,10,26,.7); border: 1px solid rgba(255,255,255,.12); text-align: left; }
  .lv .n { font-size: 24px; font-weight: 900; color: var(--cyan); line-height: 1; }
  .lv .nm { font-size: 13px; font-weight: 800; letter-spacing: .08em; margin-top: 4px; }
  .lv .best { font-size: 11px; color: var(--amber); letter-spacing: .12em; margin-top: 3px; font-weight: 700; }
  .help { font-size: 13px; color: var(--dim); line-height: 1.6; }
  .help b { color: var(--ink); }

  /* ---- touch controls */
  #touch { display: none; position: fixed; inset: 0; pointer-events: none; }
  body.touch.playing #touch { display: block; }
  .t-stick-zone { position: absolute; left: 0; bottom: 0; width: 55%; height: 62%; pointer-events: auto; touch-action: none; }
  .t-base { position: absolute; left: max(96px, 22%); top: 62%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.22); background: rgba(10,12,30,.25); }
  .t-knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.28); box-shadow: 0 0 14px rgba(53,242,255,.4); }
  .t-stick-zone.active .t-knob { background: rgba(53,242,255,.55); }
  .t-hint { position: absolute; left: max(96px, 22%); top: calc(62% + 70px); transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,.5); letter-spacing: .1em; white-space: nowrap; }
  .t-stick-zone.active .t-hint { display: none; }
  .t-btn { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; border: 2px solid rgba(255,255,255,.25);
    background: rgba(10,12,30,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; letter-spacing: .1em; }
  .t-btn small { font-size: 9px; font-weight: 600; color: rgba(255,255,255,.6); letter-spacing: .06em; }
  .t-btn.on { background: rgba(255,140,40,.45); border-color: #ffb02e; box-shadow: 0 0 20px rgba(255,140,40,.6); }
  .t-jump { right: max(20px, env(safe-area-inset-right)); bottom: max(78px, calc(env(safe-area-inset-bottom) + 64px)); width: 104px; height: 104px; font-size: 17px; }
  .t-boost { right: calc(max(20px, env(safe-area-inset-right)) + 112px); bottom: max(58px, calc(env(safe-area-inset-bottom) + 44px)); width: 74px; height: 74px; font-size: 12px; }
  .t-top { position: absolute; top: max(80px, calc(env(safe-area-inset-top) + 74px)); right: max(16px, env(safe-area-inset-right)); display: flex; gap: 8px; pointer-events: auto; }
  .t-small { width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(10,12,30,.45); font-weight: 900; }
  body.touch .fuel { bottom: max(196px, calc(env(safe-area-inset-bottom) + 186px)); width: min(200px, 44vw); }
  body.touch .bl { bottom: auto; top: max(64px, calc(env(safe-area-inset-top) + 58px)); }
  body.touch .sv { font-size: 34px; }
  body.touch .ladder { top: 30%; height: 30%; }
  @media (max-aspect-ratio: 1/1) { .sv { font-size: 44px; } .timer { font-size: 26px; } }
  body.capture .r-hint { display: none; }
  #hud.parked ~ #touch, #hud.paused ~ #touch { display: none !important; }
  body.clean #touch, body.clean .hud-play { display: none !important; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<div id="touch"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
